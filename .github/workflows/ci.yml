name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-24.04,    target: x86_64-unknown-linux-gnu, experimental: false }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc,   experimental: false }
          - { name: windows-x86, os: windows-latest, target: i686-pc-windows-msvc,     experimental: true }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: NASM (needed by aws-lc-rs on Windows)
        if: runner.os == 'Windows'
        # Installed from Chocolatey: ilammy/setup-nasm still runs on the deprecated Node 20.
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test --target ${{ matrix.target }}
