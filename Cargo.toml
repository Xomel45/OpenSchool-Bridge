[package]
name = "openschool_bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "cookies", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
uniffi = { version = "0.32.2", features = ["tokio"] }

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[profile.release]
opt-level = "z"
lto = true
strip = true

# Android: the certificate roots are built in (see `android_tls` in src/client.rs). The system verifier downloads revocation lists
# while it checks a connection, and where such a list server is slow or blocked every request hung for minutes.
[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"
